name: Third Workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: run command
        run: echo "This is build job!"
  
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: run command
        run: echo "This is test job!"

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: run command
        run: echo "This is lint job!"

  notify:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: run command
        run: echo "This is notify job!"